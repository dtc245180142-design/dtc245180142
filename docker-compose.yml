services:
  # 1. Cơ sở dữ liệu MySQL (Cô lập trong mạng backend)
  db:
    image: mysql:8.0
    container_name: de19_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - backend

  # 2. Công cụ quản trị CSDL phpMyAdmin
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: de19_phpmyadmin
    restart: always
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
    networks:
      - backend

  # 3. Website Tin tức (WordPress)
  wordpress:
    image: wordpress:latest
    container_name: de19_wordpress
    restart: always
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - wp_data:/var/www/html
    networks:
      - backend
      - frontend

  # 4. Reverse Proxy Nginx (Chịu trách nhiệm mở port ra ngoài)
  nginx:
    image: nginx:alpine
    container_name: de19_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - wordpress
    networks:
      - frontend

  # 5. Giám sát Container (cAdvisor)
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: de19_cadvisor
    restart: always
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - monitoring

  # 6. Prometheus Server
  prometheus:
    image: prom/prometheus:latest
    container_name: de19_prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - monitoring

  # 7. Grafana Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: de19_grafana
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - monitoring

  # 8. Loki (Lưu trữ Log tập trung)
  loki:
    image: grafana/loki:latest
    container_name: de19_loki
    restart: always
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
    networks:
      - monitoring

  # 9. Promtail (Thu thập Log từ Docker)
  promtail:
    image: grafana/promtail:latest
    container_name: de19_promtail
    restart: always
    volumes:
      - ./loki/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - monitoring

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
  monitoring:
    driver: bridge

volumes:
  db_data:
  wp_data:
  grafana_data:
